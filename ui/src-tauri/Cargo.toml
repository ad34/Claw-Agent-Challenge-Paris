[package]
name = "night-studio"
version = "0.1.0"
description = "Night Studio control room"
edition = "2021"

[lib]
name = "night_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
